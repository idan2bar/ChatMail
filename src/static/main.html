<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { width: 340px; margin: 0; padding: 16px; font: 14px system-ui, sans-serif; }
      .row { display: flex; align-items: center; justify-content: space-between; }
      .title { font-weight: 600; font-size: 15px; }
      .switch { position: relative; width: 40px; height: 22px; }
      .switch input { opacity: 0; width: 0; height: 0; }
      .slider { position: absolute; inset: 0; background: #bbb; border-radius: 22px; cursor: pointer; transition: background .15s; }
      .slider::before { content: ''; position: absolute; width: 18px; height: 18px; left: 2px; top: 2px; background: #fff; border-radius: 50%; transition: transform .15s; }
      input:checked + .slider { background: #1a73e8; }
      input:checked + .slider::before { transform: translateX(18px); }
      .hint a { text-decoration: none; }
      .hint { margin: 10px 0 0; color: #666; font-size: 12px; }
      #reload-box { display: none; margin-top: 12px; padding: 10px; background: #fff4e5; border-radius: 8px; font-size: 12px; }
      #reload-box button { margin-top: 8px; padding: 6px 12px; border: 0; border-radius: 6px; background: #1a73e8; color: #fff; cursor: pointer; }
    </style>
  </head>
  <body>
    <div class="row">
      <span class="title">Chat Mail</span>
      <label class="switch">
        <input type="checkbox" id="toggle" checked />
        <span class="slider"></span>
      </label>
    </div>
    <p class="hint"><a href="https://mail.google.com" target="_blank">Open Gmail</a> to see how it got better!</p>
    <div id="reload-box">
      Refresh Gmail for the change to take effect.
      <br /><button id="reload">Refresh Gmail</button>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
